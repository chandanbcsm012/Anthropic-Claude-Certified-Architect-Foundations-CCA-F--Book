<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="700" fill="#fcfcfb"/>

  <!-- title -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Three Practices, One Reliable Failure-Handling Pipeline</text>

  <!-- Layer 1: Structured Error Context (blue) -->
  <rect x="60" y="120" width="440" height="140" rx="12" fill="#2a78d6"/>
  <text x="280" y="175" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Structured Error Context</text>
  <text x="280" y="210" text-anchor="middle" font-size="13" fill="#ffffff">Tells the coordinator what happened —</text>
  <text x="280" y="232" text-anchor="middle" font-size="13" fill="#ffffff">dense enough to act on</text>

  <!-- Layer 2: Alternative Approaches (orange) -->
  <rect x="60" y="300" width="440" height="140" rx="12" fill="#eb6834"/>
  <text x="280" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Alternative Approaches</text>
  <text x="280" y="390" text-anchor="middle" font-size="13" fill="#ffffff">Supplies options: secondary tools,</text>
  <text x="280" y="412" text-anchor="middle" font-size="13" fill="#ffffff">cached data, clarifying questions</text>

  <!-- Layer 3: Early-Informed Retries (aqua) -->
  <rect x="60" y="480" width="440" height="140" rx="12" fill="#1baf7a"/>
  <text x="280" y="535" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Early-Informed Retries</text>
  <text x="280" y="570" text-anchor="middle" font-size="13" fill="#ffffff">Gives Claude the chance to choose</text>
  <text x="280" y="592" text-anchor="middle" font-size="13" fill="#ffffff">before retries are exhausted</text>

  <!-- arrows into outcome -->
  <line x1="500" y1="190" x2="738" y2="190" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="182" text-anchor="middle" font-size="12" fill="#52514e">feeds the decision</text>

  <line x1="500" y1="370" x2="738" y2="370" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="362" text-anchor="middle" font-size="12" fill="#52514e">supplies the options</text>

  <line x1="500" y1="550" x2="738" y2="550" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="542" text-anchor="middle" font-size="12" fill="#52514e">enables the choice</text>

  <!-- Outcome: Reliable, Transparent Failure Handling (yellow) -->
  <rect x="740" y="120" width="420" height="500" rx="12" fill="#eda100"/>
  <text x="950" y="340" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Reliable, Transparent</text>
  <text x="950" y="364" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Failure Handling</text>
  <text x="950" y="400" text-anchor="middle" font-size="13" fill="#ffffff">Failure is visible, structured, and</text>
  <text x="950" y="420" text-anchor="middle" font-size="13" fill="#ffffff">actionable the moment it happens</text>

  <!-- footer -->
  <text x="600" y="670" text-anchor="middle" font-size="14" fill="#52514e">Visible, structured, actionable failure handling — not buried until it's too late to matter.</text>
</svg>
