<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="420" fill="#fcfcfb"/>

  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">The Batch API's Three Decoupled Phases</text>

  <!-- Phase 1: Submission -->
  <rect x="60" y="110" width="300" height="170" rx="12" fill="#2a78d6"/>
  <text x="210" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Phase 1: Submission</text>
  <text x="210" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">POST /v1/messages/batches</text>
  <text x="210" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Returns batch ID + status</text>
  <text x="210" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Connection closes immediately</text>

  <!-- Phase 2: Waiting -->
  <rect x="450" y="110" width="300" height="170" rx="12" fill="#eb6834"/>
  <text x="600" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Phase 2: Waiting</text>
  <text x="600" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Runs in the background</text>
  <text x="600" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Poll until status = "ended"</text>
  <text x="600" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Up to 24 hours</text>

  <!-- Phase 3: Retrieval -->
  <rect x="840" y="110" width="300" height="170" rx="12" fill="#1baf7a"/>
  <text x="990" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Phase 3: Retrieval</text>
  <text x="990" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Fetch results after "ended"</text>
  <text x="990" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Matched by custom_id</text>
  <text x="990" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Any order; kept 29 days</text>

  <!-- Sequence arrows -->
  <line x1="360" y1="195" x2="450" y2="195" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="195" x2="840" y2="195" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="405" y="180" text-anchor="middle" font-size="12" font-style="italic" fill="#52514e">app disconnects</text>
  <text x="795" y="180" text-anchor="middle" font-size="12" font-style="italic" fill="#52514e">app retrieves</text>

  <!-- Polling loop under Phase 2 -->
  <path d="M 520 280 C 520 345, 680 345, 680 280" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="372" text-anchor="middle" font-size="14" fill="#52514e">App polls every ~60s until status = "ended"</text>
</svg>
