<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="750" fill="#fcfcfb"/>

  <text x="600" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Trimming a Verbose Tool Result</text>

  <!-- LEFT: Raw API Response -->
  <rect x="60" y="100" width="500" height="50" rx="12" fill="#2a78d6"/>
  <text x="310" y="132" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Raw API Response (verbose)</text>

  <rect x="60" y="155" width="500" height="525" rx="12" fill="#f5f4f1" stroke="#dedcd7" stroke-width="1"/>

  <!-- Field rows: normal (discarded) fields -->
  <rect x="75" y="170" width="470" height="34" rx="8" fill="#ffffff" stroke="#dedcd7" stroke-width="1"/>
  <text x="90" y="192" font-size="13" fill="#52514e">status: 200 OK</text>

  <rect x="75" y="212" width="470" height="34" rx="8" fill="#ffffff" stroke="#dedcd7" stroke-width="1"/>
  <text x="90" y="234" font-size="13" fill="#52514e">request_id: req_9f8a3b2c1d</text>

  <rect x="75" y="254" width="470" height="34" rx="8" fill="#ffffff" stroke="#dedcd7" stroke-width="1"/>
  <text x="90" y="276" font-size="13" fill="#52514e">timestamp: 2026-08-01T14:32:10Z</text>

  <rect x="75" y="296" width="470" height="34" rx="8" fill="#ffffff" stroke="#dedcd7" stroke-width="1"/>
  <text x="90" y="318" font-size="13" fill="#52514e">region: us-east-1</text>

  <rect x="75" y="338" width="470" height="34" rx="8" fill="#ffffff" stroke="#dedcd7" stroke-width="1"/>
  <text x="90" y="360" font-size="13" fill="#52514e">user.id: usr_88213</text>

  <!-- Kept field: name -->
  <rect x="75" y="380" width="470" height="34" rx="8" fill="#fff7f2" stroke="#eb6834" stroke-width="2"/>
  <rect x="75" y="380" width="4" height="34" rx="2" fill="#eb6834"/>
  <text x="90" y="402" font-size="14" font-weight="bold" fill="#0b0b0b">user.name: Priya Nair</text>

  <!-- Kept field: email -->
  <rect x="75" y="422" width="470" height="34" rx="8" fill="#fff7f2" stroke="#eb6834" stroke-width="2"/>
  <rect x="75" y="422" width="4" height="34" rx="2" fill="#eb6834"/>
  <text x="90" y="444" font-size="14" font-weight="bold" fill="#0b0b0b">user.email: priya.nair@example.com</text>

  <rect x="75" y="464" width="470" height="34" rx="8" fill="#ffffff" stroke="#dedcd7" stroke-width="1"/>
  <text x="90" y="486" font-size="13" fill="#52514e">user.created_at / last_login: 2022-03-11 / 2026-07-30</text>

  <rect x="75" y="506" width="470" height="34" rx="8" fill="#ffffff" stroke="#dedcd7" stroke-width="1"/>
  <text x="90" y="528" font-size="13" fill="#52514e">user.preferences: theme, notifications, language</text>

  <rect x="75" y="548" width="470" height="34" rx="8" fill="#ffffff" stroke="#dedcd7" stroke-width="1"/>
  <text x="90" y="570" font-size="13" fill="#52514e">user.audit_log: [40 entries]</text>

  <rect x="75" y="590" width="470" height="34" rx="8" fill="#ffffff" stroke="#dedcd7" stroke-width="1"/>
  <text x="90" y="612" font-size="13" fill="#52514e">user.account_tier / billing_region: premium / NA</text>

  <rect x="75" y="632" width="470" height="34" rx="8" fill="#ffffff" stroke="#dedcd7" stroke-width="1"/>
  <text x="90" y="654" font-size="13" fill="#52514e">pagination / metadata: page 1 of 1, api_version 3.2</text>

  <!-- Arrow: filter / trim -->
  <text x="629" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#52514e">Filter / Trim</text>
  <line x1="565" y1="375" x2="693" y2="375" stroke="#52514e" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- RIGHT: Trimmed Result -->
  <rect x="700" y="250" width="440" height="50" rx="12" fill="#eb6834"/>
  <text x="920" y="282" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Trimmed Result</text>

  <rect x="700" y="305" width="440" height="140" rx="12" fill="#fff7f2" stroke="#eb6834" stroke-width="1"/>

  <rect x="715" y="320" width="410" height="40" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <rect x="715" y="320" width="4" height="40" rx="2" fill="#eb6834"/>
  <text x="732" y="345" font-size="14" font-weight="bold" fill="#0b0b0b">name: Priya Nair</text>

  <rect x="715" y="370" width="410" height="40" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <rect x="715" y="370" width="4" height="40" rx="2" fill="#eb6834"/>
  <text x="732" y="395" font-size="14" font-weight="bold" fill="#0b0b0b">email: priya.nair@example.com</text>

  <text x="920" y="475" text-anchor="middle" font-size="15" fill="#52514e">Same answer. A fraction of the tokens.</text>
</svg>
