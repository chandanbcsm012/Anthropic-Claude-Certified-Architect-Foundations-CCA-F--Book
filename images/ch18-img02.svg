<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="640" fill="#fcfcfb"/>

  <!-- title -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Fallback Chain vs. a Brittle Single-Path System</text>

  <!-- LANE A container: Resilient system -->
  <rect x="35" y="80" width="1130" height="230" rx="12" fill="#f5f4f1" stroke="#dedcd7" stroke-width="1"/>
  <text x="55" y="108" font-size="16" font-weight="bold" fill="#0b0b0b">Resilient System: Fallback Chain</text>

  <!-- Box 1: Primary Tool (blue) -->
  <rect x="55" y="140" width="200" height="120" rx="12" fill="#2a78d6"/>
  <text x="155" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Primary Tool</text>
  <text x="155" y="214" text-anchor="middle" font-size="12" fill="#ffffff">Live data source</text>

  <!-- Box 2: Secondary Tool (orange) -->
  <rect x="275" y="140" width="200" height="120" rx="12" fill="#eb6834"/>
  <text x="375" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Secondary Tool</text>
  <text x="375" y="214" text-anchor="middle" font-size="12" fill="#ffffff">Equivalent backup</text>

  <!-- Box 3: Cached Data (aqua) -->
  <rect x="495" y="140" width="200" height="120" rx="12" fill="#1baf7a"/>
  <text x="595" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Cached Data</text>
  <text x="595" y="214" text-anchor="middle" font-size="12" fill="#ffffff">Last known good value</text>

  <!-- Box 4: Partial Answer (yellow) -->
  <rect x="715" y="140" width="200" height="120" rx="12" fill="#eda100"/>
  <text x="815" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Partial Answer</text>
  <text x="815" y="214" text-anchor="middle" font-size="12" fill="#ffffff">Caveated: known vs. unknown</text>

  <!-- Box 5: Escalate to Human (magenta) -->
  <rect x="935" y="140" width="200" height="120" rx="12" fill="#e87ba4"/>
  <text x="1035" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Escalate to Human</text>
  <text x="1035" y="214" text-anchor="middle" font-size="12" fill="#ffffff">Last resort, all else exhausted</text>

  <!-- arrows lane A -->
  <text x="265" y="188" text-anchor="middle" font-size="12" fill="#52514e">fails</text>
  <line x1="255" y1="200" x2="273" y2="200" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="485" y="188" text-anchor="middle" font-size="12" fill="#52514e">fails</text>
  <line x1="475" y1="200" x2="493" y2="200" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="705" y="188" text-anchor="middle" font-size="12" fill="#52514e">insufficient</text>
  <line x1="695" y1="200" x2="713" y2="200" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="925" y="182" text-anchor="middle" font-size="11" fill="#52514e">if still</text>
  <text x="925" y="195" text-anchor="middle" font-size="11" fill="#52514e">insufficient</text>
  <line x1="915" y1="200" x2="933" y2="200" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LANE B container: Brittle system -->
  <rect x="35" y="350" width="1130" height="180" rx="12" fill="#f5f4f1" stroke="#dedcd7" stroke-width="1"/>
  <text x="55" y="378" font-size="16" font-weight="bold" fill="#0b0b0b">Brittle System: No Fallback</text>

  <!-- Box: Primary Tool (blue, reused) -->
  <rect x="55" y="400" width="200" height="110" rx="12" fill="#2a78d6"/>
  <text x="155" y="460" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Primary Tool</text>

  <text x="265" y="448" text-anchor="middle" font-size="12" fill="#52514e">fails</text>
  <line x1="255" y1="455" x2="273" y2="455" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box: Hard Failure (green) -->
  <rect x="275" y="400" width="260" height="110" rx="12" fill="#008300"/>
  <text x="405" y="452" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Hard Failure</text>
  <text x="405" y="474" text-anchor="middle" font-size="12" fill="#ffffff">Returns error immediately</text>

  <!-- dead-end annotation -->
  <line x1="535" y1="455" x2="700" y2="455" stroke="#52514e" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="710" y="448" font-size="13" fill="#52514e">Chain stops here —</text>
  <text x="710" y="466" font-size="13" fill="#52514e">no fallback attempted</text>

  <!-- footer -->
  <text x="600" y="590" text-anchor="middle" font-size="14" fill="#52514e">The resilient chain keeps handing off; the brittle system stops at the very first failure.</text>
</svg>
