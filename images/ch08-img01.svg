<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <rect x="0" y="0" width="1200" height="780" fill="#fcfcfb"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Tool-Calling Accuracy vs. Number of Available Tools</text>

  <!-- Zone background tint for the effective (balanced) range -->
  <rect x="337.8" y="130" width="217.8" height="490" fill="#1baf7a" fill-opacity="0.08"/>

  <!-- Zone divider lines -->
  <line x1="337.8" y1="130" x2="337.8" y2="620" stroke="#e1e0d9" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="555.6" y1="130" x2="555.6" y2="620" stroke="#e1e0d9" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Zone labels -->
  <text x="228.9" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#52514e">Lean (&lt;10)</text>
  <text x="228.9" y="128" text-anchor="middle" font-size="12" fill="#52514e">lacks edge-case coverage</text>

  <text x="446.7" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1baf7a">Balanced (10-20)</text>
  <text x="446.7" y="128" text-anchor="middle" font-size="12" fill="#52514e">effective range</text>

  <text x="827.8" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#52514e">Bloated (20+)</text>
  <text x="827.8" y="128" text-anchor="middle" font-size="12" fill="#52514e">selection accuracy degrades</text>

  <!-- Axes -->
  <line x1="120" y1="620" x2="1100" y2="620" stroke="#898781" stroke-width="2"/>
  <line x1="120" y1="620" x2="120" y2="140" stroke="#898781" stroke-width="2"/>

  <!-- X ticks -->
  <g font-size="13" fill="#52514e">
    <line x1="120.0" y1="620" x2="120.0" y2="628" stroke="#898781" stroke-width="2"/>
    <text x="120.0" y="648" text-anchor="middle">0</text>
    <line x1="337.8" y1="620" x2="337.8" y2="628" stroke="#898781" stroke-width="2"/>
    <text x="337.8" y="648" text-anchor="middle">10</text>
    <line x1="555.6" y1="620" x2="555.6" y2="628" stroke="#898781" stroke-width="2"/>
    <text x="555.6" y="648" text-anchor="middle">20</text>
    <line x1="773.4" y1="620" x2="773.4" y2="628" stroke="#898781" stroke-width="2"/>
    <text x="773.4" y="648" text-anchor="middle">30</text>
    <line x1="991.2" y1="620" x2="991.2" y2="628" stroke="#898781" stroke-width="2"/>
    <text x="991.2" y="648" text-anchor="middle">40</text>
  </g>
  <text x="610" y="690" text-anchor="middle" font-size="15" fill="#52514e">Number of Tools Available</text>

  <!-- Y ticks -->
  <g font-size="13" fill="#52514e">
    <line x1="112" y1="620" x2="120" y2="620" stroke="#898781" stroke-width="2"/>
    <text x="104" y="625" text-anchor="end">0%</text>
    <line x1="112" y1="524" x2="120" y2="524" stroke="#898781" stroke-width="2"/>
    <text x="104" y="529" text-anchor="end">20%</text>
    <line x1="112" y1="428" x2="120" y2="428" stroke="#898781" stroke-width="2"/>
    <text x="104" y="433" text-anchor="end">40%</text>
    <line x1="112" y1="332" x2="120" y2="332" stroke="#898781" stroke-width="2"/>
    <text x="104" y="337" text-anchor="end">60%</text>
    <line x1="112" y1="236" x2="120" y2="236" stroke="#898781" stroke-width="2"/>
    <text x="104" y="241" text-anchor="end">80%</text>
    <line x1="112" y1="140" x2="120" y2="140" stroke="#898781" stroke-width="2"/>
    <text x="104" y="145" text-anchor="end">100%</text>
  </g>
  <text x="40" y="380" text-anchor="middle" font-size="15" fill="#52514e" transform="rotate(-90, 40, 380)">Tool-Selection Accuracy</text>

  <!-- Data line -->
  <path d="M120,308 L174.4,279.2 L228.9,245.6 L283.3,212 L337.8,188 L392.3,180.8 L446.7,178.4 L501.2,180.8 L555.6,183.2 L610.1,197.6 L664.5,212 L719,228.8 L773.4,245.6 L827.9,262.4 L882.3,279.2 L936.8,293.6 L991.2,308 L1045.7,320 L1100.1,332"
        fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Reference points at the effective-range boundaries -->
  <circle cx="337.8" cy="188" r="4.5" fill="#2a78d6"/>
  <circle cx="555.6" cy="183.2" r="4.5" fill="#2a78d6"/>
</svg>
