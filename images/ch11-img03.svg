<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#fcfcfb"/>

  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Directory-Level CLAUDE.md vs. Path-Specific Rule</text>

  <text x="300" y="75" text-anchor="middle" font-size="17" font-weight="bold" fill="#52514e">Directory-Level CLAUDE.md — Duplicated</text>
  <text x="900" y="75" text-anchor="middle" font-size="17" font-weight="bold" fill="#52514e">Path-Specific Rule — Single Source</text>

  <!-- LEFT PANEL -->
  <!-- Directory 1 -->
  <rect x="60" y="100" width="480" height="175" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="80" y="124" font-size="13" font-weight="bold" fill="#2a78d6">src/components/Button/</text>
  <rect x="80" y="136" width="200" height="46" rx="12" fill="#eb6834"/>
  <text x="180" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Button.tsx</text>
  <rect x="300" y="136" width="220" height="46" rx="12" fill="#1baf7a"/>
  <text x="410" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Button.test.tsx</text>
  <rect x="80" y="200" width="440" height="46" rx="12" fill="#eda100"/>
  <text x="300" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">CLAUDE.md (testing rules)</text>

  <!-- Directory 2 -->
  <rect x="60" y="295" width="480" height="175" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="80" y="319" font-size="13" font-weight="bold" fill="#2a78d6">src/api/orders/</text>
  <rect x="80" y="331" width="200" height="46" rx="12" fill="#eb6834"/>
  <text x="180" y="359" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">orderHandler.ts</text>
  <rect x="300" y="331" width="220" height="46" rx="12" fill="#1baf7a"/>
  <text x="410" y="359" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">orderHandler.test.ts</text>
  <rect x="80" y="395" width="440" height="46" rx="12" fill="#eda100"/>
  <text x="300" y="423" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">CLAUDE.md (testing rules)</text>

  <!-- Directory 3 -->
  <rect x="60" y="490" width="480" height="175" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="80" y="514" font-size="13" font-weight="bold" fill="#2a78d6">src/utils/validation/</text>
  <rect x="80" y="526" width="200" height="46" rx="12" fill="#eb6834"/>
  <text x="180" y="554" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">handler.ts</text>
  <rect x="300" y="526" width="220" height="46" rx="12" fill="#1baf7a"/>
  <text x="410" y="554" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">handler.test.ts</text>
  <rect x="80" y="590" width="440" height="46" rx="12" fill="#eda100"/>
  <text x="300" y="618" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">CLAUDE.md (testing rules)</text>

  <text x="300" y="705" text-anchor="middle" font-size="13" fill="#e34948" font-style="italic">Same testing rules copied into every directory that has a test file</text>

  <!-- RIGHT PANEL -->
  <rect x="780" y="100" width="300" height="70" rx="12" fill="#e87ba4"/>
  <text x="930" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">.claude/rules/testing.md</text>
  <text x="930" y="150" text-anchor="middle" font-size="12" fill="#ffffff">paths: **/*.test.ts, **/*.test.tsx</text>

  <!-- trunk line from rule file to spine -->
  <line x1="930" y1="170" x2="930" y2="188" stroke="#52514e" stroke-width="2"/>
  <line x1="930" y1="188" x2="1155" y2="188" stroke="#52514e" stroke-width="2"/>
  <line x1="1155" y1="188" x2="1155" y2="535" stroke="#52514e" stroke-width="2"/>

  <!-- Directory 1 -->
  <rect x="660" y="200" width="440" height="110" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="680" y="224" font-size="13" font-weight="bold" fill="#2a78d6">src/components/Button/</text>
  <rect x="680" y="236" width="180" height="50" rx="12" fill="#eb6834"/>
  <text x="770" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Button.tsx</text>
  <rect x="880" y="236" width="200" height="50" rx="12" fill="#1baf7a"/>
  <text x="980" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Button.test.tsx</text>
  <line x1="1155" y1="261" x2="1100" y2="261" stroke="#52514e" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Directory 2 -->
  <rect x="660" y="330" width="440" height="110" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="680" y="354" font-size="13" font-weight="bold" fill="#2a78d6">src/api/orders/</text>
  <rect x="680" y="366" width="180" height="50" rx="12" fill="#eb6834"/>
  <text x="770" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">orderHandler.ts</text>
  <rect x="880" y="366" width="200" height="50" rx="12" fill="#1baf7a"/>
  <text x="980" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">orderHandler.test.ts</text>
  <line x1="1155" y1="391" x2="1100" y2="391" stroke="#52514e" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Directory 3 -->
  <rect x="660" y="460" width="440" height="110" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="680" y="484" font-size="13" font-weight="bold" fill="#2a78d6">src/utils/validation/</text>
  <rect x="680" y="496" width="180" height="50" rx="12" fill="#eb6834"/>
  <text x="770" y="526" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">handler.ts</text>
  <rect x="880" y="496" width="200" height="50" rx="12" fill="#1baf7a"/>
  <text x="980" y="526" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">handler.test.ts</text>
  <line x1="1155" y1="521" x2="1100" y2="521" stroke="#52514e" stroke-width="2" marker-end="url(#arrow3)"/>

  <text x="900" y="705" text-anchor="middle" font-size="13" fill="#008300" font-style="italic">One rule file applies uniformly, wherever matching files live</text>
</svg>
