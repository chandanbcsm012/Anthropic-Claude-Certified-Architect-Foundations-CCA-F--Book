<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#fcfcfb"/>

  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Answer-Only vs. Reasoning-Included Few-Shot Examples</text>

  <!-- Row 1 label -->
  <text x="60" y="112" font-size="16" font-weight="bold" fill="#52514e">ANSWER-ONLY EXAMPLE</text>

  <!-- Row 1: Input -->
  <rect x="60" y="130" width="220" height="110" rx="12" fill="#2a78d6"/>
  <text x="90" y="167" font-size="16" font-weight="bold" fill="#ffffff">INPUT</text>
  <text x="90" y="194" font-size="13" font-style="italic" fill="#ffffff">"I bought this jacket</text>
  <text x="90" y="214" font-size="13" font-style="italic" fill="#ffffff">for $89 last week..."</text>

  <!-- Row 1 arrow -->
  <line x1="282" y1="185" x2="856" y2="185" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="569" y="167" text-anchor="middle" font-size="13" font-style="italic" fill="#52514e">no reasoning shown</text>

  <!-- Row 1: Output (uncertain) -->
  <rect x="860" y="130" width="280" height="110" rx="12" fill="#eb6834"/>
  <text x="890" y="167" font-size="16" font-weight="bold" fill="#ffffff">OUTPUT — UNCERTAIN</text>
  <text x="890" y="194" font-size="14" fill="#ffffff">refund_amount: null</text>
  <text x="890" y="214" font-size="12" font-style="italic" fill="#ffffff">(which feature mattered?)</text>

  <!-- Row 2 label -->
  <text x="60" y="375" font-size="16" font-weight="bold" fill="#52514e">REASONING-INCLUDED EXAMPLE</text>

  <!-- Row 2: Input -->
  <rect x="60" y="400" width="220" height="110" rx="12" fill="#2a78d6"/>
  <text x="90" y="437" font-size="16" font-weight="bold" fill="#ffffff">INPUT</text>
  <text x="90" y="464" font-size="13" font-style="italic" fill="#ffffff">"I bought this jacket</text>
  <text x="90" y="484" font-size="13" font-style="italic" fill="#ffffff">for $89 last week..."</text>

  <!-- Row 2 arrow 1 -->
  <line x1="282" y1="455" x2="426" y2="455" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Reasoning -->
  <rect x="430" y="400" width="280" height="110" rx="12" fill="#1baf7a"/>
  <text x="460" y="437" font-size="16" font-weight="bold" fill="#ffffff">REASONING</text>
  <text x="460" y="464" font-size="12" font-style="italic" fill="#ffffff">"$89 is purchase price,</text>
  <text x="460" y="482" font-size="12" font-style="italic" fill="#ffffff">not a requested refund."</text>

  <!-- Row 2 arrow 2 -->
  <line x1="712" y1="455" x2="856" y2="455" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Output (reliable) -->
  <rect x="860" y="400" width="280" height="110" rx="12" fill="#eda100"/>
  <text x="890" y="437" font-size="16" font-weight="bold" fill="#ffffff">OUTPUT — RELIABLE</text>
  <text x="890" y="464" font-size="14" fill="#ffffff">refund_amount: null</text>
  <text x="890" y="484" font-size="12" font-style="italic" fill="#ffffff">(rule learned → generalizes)</text>
</svg>
