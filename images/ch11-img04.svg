<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="720" fill="#fcfcfb"/>

  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Context Tokens at Session Start: Unscoped vs. Path-Scoped Rules</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#52514e">Scenario: only a front-end task is being performed this session</text>

  <!-- Axis -->
  <line x1="150" y1="620" x2="1050" y2="620" stroke="#898781" stroke-width="2"/>
  <line x1="150" y1="620" x2="150" y2="120" stroke="#898781" stroke-width="2"/>

  <!-- Gridlines + labels: 0 to 5000 tokens, 100px per 1000 tokens -->
  <g font-size="12" fill="#52514e">
    <line x1="150" y1="620" x2="1050" y2="620" stroke="#e1e0d9" stroke-width="1"/>
    <text x="140" y="624" text-anchor="end">0</text>

    <line x1="150" y1="520" x2="1050" y2="520" stroke="#e1e0d9" stroke-width="1"/>
    <text x="140" y="524" text-anchor="end">1,000</text>

    <line x1="150" y1="420" x2="1050" y2="420" stroke="#e1e0d9" stroke-width="1"/>
    <text x="140" y="424" text-anchor="end">2,000</text>

    <line x1="150" y1="320" x2="1050" y2="320" stroke="#e1e0d9" stroke-width="1"/>
    <text x="140" y="324" text-anchor="end">3,000</text>

    <line x1="150" y1="220" x2="1050" y2="220" stroke="#e1e0d9" stroke-width="1"/>
    <text x="140" y="224" text-anchor="end">4,000</text>

    <line x1="150" y1="120" x2="1050" y2="120" stroke="#e1e0d9" stroke-width="1"/>
    <text x="140" y="124" text-anchor="end">5,000</text>
  </g>

  <text x="70" y="370" text-anchor="middle" font-size="13" fill="#52514e" transform="rotate(-90 70 370)">Tokens loaded at session start</text>

  <!-- BAR 1: 5 unscoped rules, all load, stacked -->
  <!-- API 800 -->
  <rect x="330" y="540" width="150" height="80" fill="#2a78d6"/>
  <text x="405" y="585" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">API 800</text>
  <!-- Testing 850 -->
  <rect x="330" y="455" width="150" height="85" fill="#eb6834"/>
  <text x="405" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Testing 850</text>
  <!-- Terraform 900 -->
  <rect x="330" y="365" width="150" height="90" fill="#1baf7a"/>
  <text x="405" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Terraform 900</text>
  <!-- Front-end 950 -->
  <rect x="330" y="270" width="150" height="95" fill="#eda100"/>
  <text x="405" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Front-end 950</text>
  <!-- Database 800 -->
  <rect x="330" y="190" width="150" height="80" fill="#e87ba4"/>
  <text x="405" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Database 800</text>

  <text x="405" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b0b0b">4,300 tokens</text>

  <!-- BAR 2: 5 path-scoped rules, only front-end matches -->
  <!-- ghost/unloaded: Database, Terraform, Testing, API stacked above (dashed, hollow) -->
  <rect x="730" y="445" width="150" height="80" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="805" y="489" text-anchor="middle" font-size="11" fill="#898781">Database — not loaded</text>

  <rect x="730" y="355" width="150" height="90" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="805" y="404" text-anchor="middle" font-size="11" fill="#898781">Terraform — not loaded</text>

  <rect x="730" y="270" width="150" height="85" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="805" y="316" text-anchor="middle" font-size="11" fill="#898781">Testing — not loaded</text>

  <rect x="730" y="190" width="150" height="80" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="805" y="234" text-anchor="middle" font-size="11" fill="#898781">API — not loaded</text>

  <!-- loaded: Front-end only, solid -->
  <rect x="730" y="525" width="150" height="95" fill="#eda100"/>
  <text x="805" y="577" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Front-end 950</text>

  <text x="805" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b0b0b">950 tokens loaded</text>

  <!-- category labels -->
  <text x="405" y="655" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b0b0b">5 Unscoped Rules</text>
  <text x="405" y="674" text-anchor="middle" font-size="12" fill="#52514e">(all load at session start)</text>

  <text x="805" y="655" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b0b0b">5 Path-Scoped Rules</text>
  <text x="805" y="674" text-anchor="middle" font-size="12" fill="#52514e">(only front-end task's rule matches)</text>

  <text x="600" y="705" text-anchor="middle" font-size="13" fill="#52514e" font-style="italic">Path scoping avoids loading 3,350 tokens of irrelevant rules this session</text>
</svg>
