<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="480" fill="#fcfcfb"/>

  <text x="600" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Free-Text JSON vs. tool_use with JSON Schema</text>

  <!-- Row 1 label -->
  <text x="40" y="70" font-size="16" font-weight="bold" fill="#52514e">OLD FLOW — FREE-TEXT JSON PROMPTING</text>

  <!-- Fail marker above Parse box -->
  <text x="600" y="66" text-anchor="middle" font-size="12" fill="#52514e">fences, trailing commas, or truncation break the parser here</text>
  <circle cx="600" cy="86" r="14" fill="#e34948"/>
  <text x="600" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">&#10005;</text>
  <line x1="600" y1="100" x2="600" y2="104" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 1 boxes -->
  <rect x="40" y="105" width="204" height="64" rx="12" fill="#2a78d6"/>
  <text x="142" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Prompt</text>

  <rect x="269" y="105" width="204" height="64" rx="12" fill="#eb6834"/>
  <text x="371" y="131" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Free-text</text>
  <text x="371" y="149" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">response</text>

  <rect x="498" y="105" width="204" height="64" rx="12" fill="#1baf7a"/>
  <text x="600" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Parse</text>

  <rect x="727" y="105" width="204" height="64" rx="12" fill="#eda100"/>
  <text x="829" y="131" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Patch</text>
  <text x="829" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">(regex fixes)</text>

  <rect x="956" y="105" width="204" height="64" rx="12" fill="#e87ba4"/>
  <text x="1058" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Retry</text>

  <!-- Row 1 connecting arrows -->
  <line x1="244" y1="137" x2="269" y2="137" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="473" y1="137" x2="498" y2="137" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="702" y1="137" x2="727" y2="137" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="931" y1="137" x2="956" y2="137" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Retry loop -->
  <path d="M 1058 169 C 1058 235, 142 235, 142 169" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="231" text-anchor="middle" font-size="13" fill="#52514e">retry loop — the failure keeps reappearing in new forms</text>

  <!-- Divider -->
  <line x1="40" y1="255" x2="1160" y2="255" stroke="#e1e0d9" stroke-width="2"/>
  <rect x="578" y="238" width="44" height="20" fill="#fcfcfb"/>
  <text x="600" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#52514e">VS</text>

  <!-- Row 2 label -->
  <text x="40" y="278" font-size="16" font-weight="bold" fill="#52514e">NEW FLOW — tool_use WITH JSON SCHEMA</text>

  <!-- Row 2 boxes -->
  <rect x="40" y="290" width="346" height="70" rx="12" fill="#008300"/>
  <text x="213" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Tool definition</text>
  <text x="213" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">+ Schema</text>

  <rect x="427" y="290" width="346" height="70" rx="12" fill="#4a3aa7"/>
  <text x="600" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Validated</text>
  <text x="600" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">tool_use.input</text>

  <rect x="814" y="290" width="346" height="70" rx="12" fill="#e34948"/>
  <text x="987" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Application</text>
  <text x="987" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">code</text>

  <!-- Row 2 connecting arrows -->
  <line x1="386" y1="325" x2="427" y2="325" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="773" y1="325" x2="814" y2="325" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Annotation -->
  <text x="600" y="400" text-anchor="middle" font-size="15" fill="#52514e">No parse step. No patch step. No retry loop.</text>
  <text x="600" y="424" text-anchor="middle" font-size="15" fill="#52514e">The failure point disappears entirely.</text>
</svg>
