<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <defs>
    <marker id="arrow01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="480" fill="#fcfcfb"/>

  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Interactive Mode vs. -p Mode in a CI Runner</text>

  <!-- ===================== Lane 1: without -p ===================== -->
  <text x="50" y="88" font-size="16" font-weight="600" fill="#52514e">Without -p — interactive mode (stalls)</text>

  <rect x="50" y="105" width="170" height="100" rx="12" fill="#2a78d6"/>
  <text x="135" y="161" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">CI Runner</text>

  <rect x="270" y="105" width="190" height="100" rx="12" fill="#eb6834"/>
  <text x="365" y="161" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">claude (no -p)</text>

  <rect x="510" y="105" width="230" height="100" rx="12" fill="#1baf7a"/>
  <text x="625" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Waiting for input…</text>
  <text x="625" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">(stalled)</text>
  <!-- clock icon: stalled / idle -->
  <circle cx="700" cy="125" r="13" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="700" y1="125" x2="700" y2="116" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="700" y1="125" x2="706" y2="128" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <rect x="790" y="105" width="250" height="100" rx="12" fill="#eda100"/>
  <text x="915" y="161" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Timeout: job killed</text>
  <!-- x icon: failure -->
  <circle cx="1000" cy="125" r="13" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="994" y1="119" x2="1006" y2="131" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="1006" y1="119" x2="994" y2="131" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- arrows lane 1 -->
  <line x1="220" y1="155" x2="266" y2="155" stroke="#52514e" stroke-width="2" marker-end="url(#arrow01)"/>
  <line x1="460" y1="155" x2="506" y2="155" stroke="#52514e" stroke-width="2" marker-end="url(#arrow01)"/>
  <line x1="740" y1="155" x2="786" y2="155" stroke="#52514e" stroke-width="2" marker-end="url(#arrow01)"/>

  <!-- annotations lane 1 -->
  <text x="365" y="228" text-anchor="middle" font-size="12" fill="#52514e">$ claude "Summarize this PR"</text>
  <text x="625" y="228" text-anchor="middle" font-size="12" fill="#52514e">(no one will respond)</text>
  <text x="915" y="228" text-anchor="middle" font-size="12" fill="#52514e">(hangs, then killed by CI timeout)</text>

  <!-- separator -->
  <line x1="50" y1="258" x2="1150" y2="258" stroke="#898781" stroke-width="1" stroke-dasharray="6,6"/>

  <!-- ===================== Lane 2: with -p ===================== -->
  <text x="50" y="300" font-size="16" font-weight="600" fill="#52514e">With -p — print / non-interactive mode (completes)</text>

  <rect x="50" y="317" width="170" height="100" rx="12" fill="#2a78d6"/>
  <text x="135" y="373" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">CI Runner</text>

  <rect x="270" y="317" width="190" height="100" rx="12" fill="#e87ba4"/>
  <text x="365" y="373" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">claude -p</text>

  <rect x="510" y="317" width="230" height="100" rx="12" fill="#008300"/>
  <text x="625" y="364" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Process prompt &amp;</text>
  <text x="625" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">write to stdout</text>

  <rect x="790" y="317" width="250" height="100" rx="12" fill="#4a3aa7"/>
  <text x="915" y="364" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Exit 0 —</text>
  <text x="915" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">pipeline continues</text>
  <!-- check icon: success -->
  <circle cx="1000" cy="337" r="13" fill="none" stroke="#ffffff" stroke-width="2"/>
  <polyline points="994,337 998,342 1006,331" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- arrows lane 2 -->
  <line x1="220" y1="367" x2="266" y2="367" stroke="#52514e" stroke-width="2" marker-end="url(#arrow01)"/>
  <line x1="460" y1="367" x2="506" y2="367" stroke="#52514e" stroke-width="2" marker-end="url(#arrow01)"/>
  <line x1="740" y1="367" x2="786" y2="367" stroke="#52514e" stroke-width="2" marker-end="url(#arrow01)"/>

  <!-- annotations lane 2 -->
  <text x="365" y="440" text-anchor="middle" font-size="12" fill="#52514e">$ claude -p "Summarize this PR"</text>
  <text x="625" y="440" text-anchor="middle" font-size="12" fill="#52514e">(stdout captured by pipeline)</text>
  <text x="915" y="440" text-anchor="middle" font-size="12" fill="#52514e">(job succeeds, next step runs)</text>
</svg>
