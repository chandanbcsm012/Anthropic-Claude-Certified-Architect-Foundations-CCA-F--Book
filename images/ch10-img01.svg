<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#fcfcfb"/>

  <text x="600" y="48" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">CLAUDE.md vs. Agent Skill: When Content Loads</text>

  <!-- Row 1: CLAUDE.md -->
  <text x="40" y="180" font-size="16" font-weight="bold" fill="#52514e">CLAUDE.md</text>
  <rect x="300" y="140" width="800" height="70" rx="12" fill="#2a78d6"/>
  <text x="700" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Full content loaded — stays resident all session</text>

  <line x1="300" y1="230" x2="1140" y2="230" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="222" x2="300" y2="238" stroke="#52514e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="300" y="256" text-anchor="middle" font-size="13" fill="#52514e">Session Start</text>
  <text x="1130" y="256" text-anchor="end" font-size="13" fill="#52514e">End of Session</text>

  <!-- Row 2: Agent Skill -->
  <text x="40" y="380" font-size="16" font-weight="bold" fill="#52514e">Agent Skill</text>

  <rect x="300" y="340" width="170" height="70" rx="12" fill="#eb6834"/>
  <text x="385" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">name +</text>
  <text x="385" y="391" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">description</text>

  <line x1="470" y1="375" x2="650" y2="375" stroke="#52514e" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="560" y="330" text-anchor="middle" font-size="13" font-style="italic" fill="#52514e">not yet relevant to any request</text>

  <line x1="650" y1="322" x2="650" y2="428" stroke="#52514e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="650" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#52514e">Task matches description</text>

  <rect x="650" y="340" width="490" height="70" rx="12" fill="#1baf7a"/>
  <text x="895" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Full SKILL.md body loads on demand</text>

  <line x1="300" y1="430" x2="1140" y2="430" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="422" x2="300" y2="438" stroke="#52514e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="300" y="456" text-anchor="middle" font-size="13" fill="#52514e">Session Start</text>
  <line x1="650" y1="422" x2="650" y2="438" stroke="#52514e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="650" y="456" text-anchor="middle" font-size="13" fill="#52514e">Skill activates</text>

  <text x="600" y="500" text-anchor="middle" font-size="14" font-style="italic" fill="#52514e">Time →</text>
</svg>
