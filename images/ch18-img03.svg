<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="720" fill="#fcfcfb"/>

  <!-- title -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Silent Retry-Until-Exhaustion vs. Informed Retry</text>

  <!-- LANE A: Silent retry (anti-pattern) -->
  <rect x="35" y="80" width="1130" height="270" rx="12" fill="#f5f4f1" stroke="#dedcd7" stroke-width="1"/>
  <text x="55" y="108" font-size="16" font-weight="bold" fill="#0b0b0b">Silent Retry-Until-Exhaustion (Anti-Pattern)</text>
  <text x="470" y="132" text-anchor="middle" font-size="13" fill="#52514e">Three attempts fail silently before Claude hears anything</text>

  <!-- Attempt 1 (blue) -->
  <rect x="55" y="140" width="150" height="90" rx="12" fill="#2a78d6"/>
  <text x="130" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Attempt 1</text>
  <text x="130" y="198" text-anchor="middle" font-size="12" fill="#ffffff">Fails</text>

  <!-- Attempt 2 (blue) -->
  <rect x="245" y="140" width="150" height="90" rx="12" fill="#2a78d6"/>
  <text x="320" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Attempt 2</text>
  <text x="320" y="198" text-anchor="middle" font-size="12" fill="#ffffff">Fails</text>

  <!-- Attempt 3 (blue) -->
  <rect x="435" y="140" width="150" height="90" rx="12" fill="#2a78d6"/>
  <text x="510" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Attempt 3</text>
  <text x="510" y="198" text-anchor="middle" font-size="12" fill="#ffffff">Fails</text>

  <!-- Report to Claude, bundled (orange) -->
  <rect x="625" y="140" width="260" height="90" rx="12" fill="#eb6834"/>
  <text x="755" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Report to Claude</text>
  <text x="755" y="198" text-anchor="middle" font-size="12" fill="#ffffff">3 failures bundled (too late)</text>

  <line x1="205" y1="185" x2="243" y2="185" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="185" x2="433" y2="185" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="585" y1="185" x2="623" y2="185" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- no-visibility annotation -->
  <line x1="130" y1="230" x2="130" y2="250" stroke="#52514e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="320" y1="230" x2="320" y2="250" stroke="#52514e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="510" y1="230" x2="510" y2="250" stroke="#52514e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="55" y="250" width="530" height="60" rx="8" fill="none" stroke="#52514e" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="320" y="286" text-anchor="middle" font-size="13" fill="#52514e">Claude has no visibility during all three attempts</text>

  <!-- LANE B: Informed retry (fix) -->
  <rect x="35" y="380" width="1130" height="280" rx="12" fill="#f5f4f1" stroke="#dedcd7" stroke-width="1"/>
  <text x="55" y="408" font-size="16" font-weight="bold" fill="#0b0b0b">Informed Retry (Fix)</text>
  <text x="600" y="431" text-anchor="middle" font-size="13" fill="#52514e">Attempt 1 fails, Claude is informed immediately, and reasons while retries continue</text>

  <!-- Attempt 1 (blue) -->
  <rect x="55" y="440" width="150" height="90" rx="12" fill="#2a78d6"/>
  <text x="130" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Attempt 1</text>
  <text x="130" y="498" text-anchor="middle" font-size="12" fill="#ffffff">Fails</text>

  <!-- Report to Claude, immediate (orange) -->
  <rect x="245" y="440" width="200" height="90" rx="12" fill="#eb6834"/>
  <text x="345" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Report to Claude</text>
  <text x="345" y="498" text-anchor="middle" font-size="12" fill="#ffffff">Immediately, after attempt 1</text>

  <!-- Attempt 2, background (blue, muted) -->
  <rect x="485" y="440" width="150" height="90" rx="12" fill="#2a78d6" fill-opacity="0.55" stroke="#52514e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="560" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Attempt 2</text>
  <text x="560" y="498" text-anchor="middle" font-size="12" fill="#ffffff">In background</text>

  <!-- Attempt 3, background (blue, muted) -->
  <rect x="675" y="440" width="150" height="90" rx="12" fill="#2a78d6" fill-opacity="0.55" stroke="#52514e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="750" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Attempt 3</text>
  <text x="750" y="498" text-anchor="middle" font-size="12" fill="#ffffff">May be skipped</text>

  <!-- Claude Redirects, outcome (yellow) -->
  <rect x="865" y="440" width="260" height="90" rx="12" fill="#eda100"/>
  <text x="995" y="478" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Claude Redirects</text>
  <text x="995" y="498" text-anchor="middle" font-size="12" fill="#ffffff">Switches tool, retries end</text>

  <line x1="205" y1="485" x2="243" y2="485" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="445" y1="485" x2="483" y2="485" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="635" y1="485" x2="673" y2="485" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="485" x2="863" y2="485" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Claude reasoning in parallel (aqua) -->
  <line x1="345" y1="530" x2="345" y2="558" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="245" y="560" width="580" height="70" rx="12" fill="#1baf7a"/>
  <text x="535" y="590" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Claude Reasoning in Parallel</text>
  <text x="535" y="612" text-anchor="middle" font-size="13" fill="#ffffff">with Attempts 2 &amp; 3, ready to redirect</text>
  <line x1="790" y1="575" x2="895" y2="532" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="880" y="555" text-anchor="middle" font-size="12" fill="#52514e">decides</text>

  <!-- footer -->
  <text x="600" y="690" text-anchor="middle" font-size="14" fill="#52514e">Same three attempts, but Claude gets the chance to reason and redirect after the first failure, not the last.</text>
</svg>
