<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="600" fill="#fcfcfb"/>

  <text x="600" y="45" text-anchor="middle" font-size="26" font-weight="bold" fill="#0b0b0b">CLAUDE.md Loading Order and Precedence</text>

  <!-- Sequential loading boxes -->
  <rect x="60" y="120" width="240" height="100" rx="12" fill="#2a78d6"/>
  <text x="180" y="164" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1. Managed</text>
  <text x="180" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">(org-wide)</text>

  <rect x="340" y="120" width="240" height="100" rx="12" fill="#eb6834"/>
  <text x="460" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2. Project-Level</text>

  <rect x="620" y="120" width="240" height="100" rx="12" fill="#1baf7a"/>
  <text x="740" y="164" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3. Directory-Level</text>
  <text x="740" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">(on demand)</text>

  <rect x="900" y="120" width="240" height="100" rx="12" fill="#eda100"/>
  <text x="1020" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4. User-Level</text>

  <!-- Loading-order arrows -->
  <line x1="300" y1="170" x2="336" y2="170" stroke="#52514e" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="580" y1="170" x2="616" y2="170" stroke="#52514e" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="860" y1="170" x2="896" y2="170" stroke="#52514e" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Descriptions under each box -->
  <text x="180" y="252" text-anchor="middle" font-size="12" fill="#52514e">Loaded first, always —</text>
  <text x="180" y="268" text-anchor="middle" font-size="12" fill="#52514e">cannot be overridden</text>

  <text x="460" y="252" text-anchor="middle" font-size="12" fill="#52514e">Loaded at session start,</text>
  <text x="460" y="268" text-anchor="middle" font-size="12" fill="#52514e">whole repository</text>

  <text x="740" y="252" text-anchor="middle" font-size="12" fill="#52514e">Loaded only while Claude</text>
  <text x="740" y="268" text-anchor="middle" font-size="12" fill="#52514e">works in that folder</text>

  <text x="1020" y="252" text-anchor="middle" font-size="12" fill="#52514e">Loaded at session start,</text>
  <text x="1020" y="268" text-anchor="middle" font-size="12" fill="#52514e">personal overlay</text>

  <!-- Precedence override arrow: narrower overrides broader -->
  <path d="M 740 300 C 740 420, 460 420, 460 300" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="600" y="460" text-anchor="middle" font-size="14" fill="#52514e">More specific overrides broader when instructions conflict</text>
  <text x="600" y="480" text-anchor="middle" font-size="14" fill="#52514e">(e.g., Directory-Level overrides Project-Level) — except the Managed tier, which is never overridden</text>
</svg>
