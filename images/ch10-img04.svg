<svg viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect width="1200" height="650" fill="#fcfcfb"/>

  <text x="600" y="46" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Progressive Disclosure: SKILL.md and Supporting Files</text>

  <!-- Entry point node -->
  <rect x="500" y="100" width="200" height="80" rx="12" fill="#2a78d6"/>
  <text x="600" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">SKILL.md</text>
  <text x="600" y="162" text-anchor="middle" font-size="13" fill="#ffffff">lean entry point</text>

  <!-- Branch lines -->
  <line x1="600" y1="180" x2="250" y2="278" stroke="#52514e" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="600" y1="180" x2="600" y2="278" stroke="#52514e" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="600" y1="180" x2="950" y2="278" stroke="#52514e" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- scripts/ -->
  <rect x="100" y="280" width="300" height="140" rx="12" fill="#eb6834"/>
  <text x="250" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">scripts/</text>
  <text x="250" y="360" text-anchor="middle" font-size="14" fill="#ffffff">scan_dependencies.sh</text>
  <text x="250" y="446" text-anchor="middle" font-size="13" fill="#52514e">Only the script's output</text>
  <text x="250" y="466" text-anchor="middle" font-size="13" fill="#52514e">loads into context, not its source</text>

  <!-- references/ -->
  <rect x="450" y="280" width="300" height="140" rx="12" fill="#1baf7a"/>
  <text x="600" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">references/</text>
  <text x="600" y="360" text-anchor="middle" font-size="14" fill="#ffffff">owasp-top-10.md</text>
  <text x="600" y="446" text-anchor="middle" font-size="13" fill="#52514e">Loaded only if the task</text>
  <text x="600" y="466" text-anchor="middle" font-size="13" fill="#52514e">needs that specific detail</text>

  <!-- assets/ -->
  <rect x="800" y="280" width="300" height="140" rx="12" fill="#eda100"/>
  <text x="950" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">assets/</text>
  <text x="950" y="360" text-anchor="middle" font-size="14" fill="#ffffff">report-template.md</text>
  <text x="950" y="446" text-anchor="middle" font-size="13" fill="#52514e">Loaded only when</text>
  <text x="950" y="466" text-anchor="middle" font-size="13" fill="#52514e">generating final output</text>
</svg>
