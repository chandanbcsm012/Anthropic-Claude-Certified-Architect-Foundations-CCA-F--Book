<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <defs>
    <marker id="arrow17-1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="480" fill="#fcfcfb"/>

  <!-- title -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Escalation Trigger Routing</text>

  <!-- divider between the two paths -->
  <line x1="615" y1="95" x2="615" y2="420" stroke="#52514e" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- group annotations -->
  <text x="315" y="85" text-anchor="middle" font-size="15" fill="#52514e">Three Valid Triggers</text>
  <text x="880" y="85" text-anchor="middle" font-size="15" fill="#52514e">Not Valid Alone</text>

  <!-- LEFT PATH: three valid triggers -->
  <!-- Box 1: Direct Human Request (blue) -->
  <rect x="40" y="100" width="170" height="70" rx="12" fill="#2a78d6"/>
  <text x="125" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Direct Human</text>
  <text x="125" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Request</text>

  <!-- Box 2: Authority Gap (orange) -->
  <rect x="230" y="100" width="170" height="70" rx="12" fill="#eb6834"/>
  <text x="315" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Authority Gap</text>

  <!-- Box 3: Verification Flag (aqua) -->
  <rect x="420" y="100" width="170" height="70" rx="12" fill="#1baf7a"/>
  <text x="505" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Verification</text>
  <text x="505" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Flag</text>

  <!-- RIGHT PATH: not valid alone -->
  <!-- Box 4: Frustration (magenta) -->
  <rect x="650" y="100" width="220" height="70" rx="12" fill="#e87ba4"/>
  <text x="760" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Frustration</text>

  <!-- Box 5: Complexity (green) -->
  <rect x="890" y="100" width="220" height="70" rx="12" fill="#008300"/>
  <text x="1000" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Complexity</text>

  <!-- arrows converging into Escalate -->
  <line x1="125" y1="170" x2="308" y2="328" stroke="#52514e" stroke-width="2" marker-end="url(#arrow17-1)"/>
  <line x1="315" y1="170" x2="315" y2="328" stroke="#52514e" stroke-width="2" marker-end="url(#arrow17-1)"/>
  <line x1="505" y1="170" x2="322" y2="328" stroke="#52514e" stroke-width="2" marker-end="url(#arrow17-1)"/>

  <!-- arrows converging into Investigate -->
  <line x1="760" y1="170" x2="840" y2="328" stroke="#52514e" stroke-width="2" marker-end="url(#arrow17-1)"/>
  <line x1="1000" y1="170" x2="920" y2="328" stroke="#52514e" stroke-width="2" marker-end="url(#arrow17-1)"/>

  <!-- Merge box: Escalate (yellow) -->
  <rect x="185" y="330" width="260" height="80" rx="12" fill="#eda100"/>
  <text x="315" y="376" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Escalate</text>

  <!-- Merge box: Investigate for a real trigger first (violet) -->
  <rect x="700" y="330" width="360" height="80" rx="12" fill="#4a3aa7"/>
  <text x="880" y="362" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Investigate for a</text>
  <text x="880" y="384" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Real Trigger First</text>

  <!-- outcome annotations -->
  <text x="315" y="443" text-anchor="middle" font-size="13" fill="#52514e">Human handoff — no further reprompting</text>
  <text x="880" y="443" text-anchor="middle" font-size="13" fill="#52514e">Back into normal resolution unless a real trigger is found</text>
</svg>
