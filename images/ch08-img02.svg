<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <defs>
    <marker id="arrow02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1000" fill="#fcfcfb"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Role-Scoped Multi-Agent Architecture</text>
  <text x="600" y="78" text-anchor="middle" font-size="14" fill="#52514e">Coordinator invokes each subagent via the Agent tool, with allowedTools scoped per role</text>

  <!-- Arrows from coordinator to each subagent -->
  <line x1="500" y1="515" x2="382" y2="278" stroke="#52514e" stroke-width="2" marker-end="url(#arrow02)"/>
  <line x1="700" y1="515" x2="818" y2="278" stroke="#52514e" stroke-width="2" marker-end="url(#arrow02)"/>
  <line x1="600" y1="562" x2="600" y2="618" stroke="#52514e" stroke-width="2" marker-end="url(#arrow02)"/>

  <!-- Coordinator hub -->
  <rect x="500" y="470" width="200" height="90" rx="12" fill="#2a78d6"/>
  <text x="600" y="510" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Coordinator</text>
  <text x="600" y="530" text-anchor="middle" font-size="12" fill="#ffffff">central orchestration</text>

  <!-- Research Agent container -->
  <rect x="40" y="110" width="340" height="320" rx="16" fill="none" stroke="#eb6834" stroke-width="2"/>
  <rect x="60" y="130" width="300" height="50" rx="12" fill="#eb6834"/>
  <text x="210" y="162" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Research Agent</text>

  <rect x="70" y="200" width="280" height="40" rx="10" fill="#eb6834"/>
  <text x="210" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">web_search</text>
  <rect x="70" y="252" width="280" height="40" rx="10" fill="#eb6834"/>
  <text x="210" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">read_document</text>
  <rect x="70" y="304" width="280" height="40" rx="10" fill="#eb6834"/>
  <text x="210" y="329" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">summarize_text</text>

  <!-- Code Agent container -->
  <rect x="820" y="110" width="340" height="320" rx="16" fill="none" stroke="#1baf7a" stroke-width="2"/>
  <rect x="840" y="130" width="300" height="50" rx="12" fill="#1baf7a"/>
  <text x="990" y="162" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Code Agent</text>

  <rect x="850" y="200" width="280" height="40" rx="10" fill="#1baf7a"/>
  <text x="990" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">execute_code</text>
  <rect x="850" y="252" width="280" height="40" rx="10" fill="#1baf7a"/>
  <text x="990" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">read_file</text>
  <rect x="850" y="304" width="280" height="40" rx="10" fill="#1baf7a"/>
  <text x="990" y="329" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">write_file</text>
  <rect x="850" y="356" width="280" height="40" rx="10" fill="#1baf7a"/>
  <text x="990" y="381" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">run_linter</text>

  <!-- Operations Agent container -->
  <rect x="430" y="620" width="340" height="330" rx="16" fill="none" stroke="#eda100" stroke-width="2"/>
  <rect x="450" y="640" width="300" height="50" rx="12" fill="#eda100"/>
  <text x="600" y="672" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Operations Agent</text>

  <rect x="460" y="710" width="280" height="40" rx="10" fill="#eda100"/>
  <text x="600" y="735" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">send_email</text>
  <rect x="460" y="762" width="280" height="40" rx="10" fill="#eda100"/>
  <text x="600" y="787" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">read_calendar</text>
  <rect x="460" y="814" width="280" height="40" rx="10" fill="#eda100"/>
  <text x="600" y="839" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">create_calendar_event</text>
  <rect x="460" y="866" width="280" height="40" rx="10" fill="#eda100"/>
  <text x="600" y="891" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">create_task</text>

  <!-- Footer note -->
  <text x="600" y="975" text-anchor="middle" font-size="13" fill="#52514e">No tool appears in more than one agent's box — ownership and blast radius stay clean.</text>
</svg>
