<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#fcfcfb"/>

  <text x="600" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">SKILL.md Structure and Storage Locations</text>

  <!-- Outer skill folder container -->
  <rect x="70" y="130" width="520" height="480" rx="16" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/>
  <text x="330" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b0b0b">SKILL.md</text>
  <line x1="100" y1="188" x2="560" y2="188" stroke="#52514e" stroke-width="1.5"/>

  <!-- Front matter box -->
  <rect x="110" y="210" width="440" height="130" rx="12" fill="#2a78d6"/>
  <text x="330" y="268" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Front Matter</text>
  <text x="330" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">name, description</text>
  <text x="330" y="360" text-anchor="middle" font-size="13" font-style="italic" fill="#52514e">Read first — every session</text>

  <!-- Instructions body box -->
  <rect x="110" y="390" width="440" height="170" rx="12" fill="#eb6834"/>
  <text x="330" y="468" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Instructions Body</text>
  <text x="330" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">the how-to steps</text>
  <text x="330" y="582" text-anchor="middle" font-size="13" font-style="italic" fill="#52514e">Loaded only once the skill activates</text>

  <!-- Arrows fanning out to the two locations -->
  <line x1="590" y1="270" x2="758" y2="255" stroke="#52514e" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="590" y1="465" x2="758" y2="478" stroke="#52514e" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Personal skill location -->
  <rect x="760" y="180" width="370" height="160" rx="12" fill="#1baf7a"/>
  <polygon points="920,222 945,197 970,222" fill="#ffffff"/>
  <rect x="925" y="222" width="40" height="30" fill="#ffffff"/>
  <rect x="939" y="236" width="12" height="16" fill="#1baf7a"/>
  <text x="945" y="288" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Personal Skill</text>
  <text x="945" y="312" text-anchor="middle" font-size="13" fill="#ffffff">home directory (~/.claude/skills/)</text>

  <!-- Project skill location -->
  <rect x="760" y="400" width="370" height="160" rx="12" fill="#eda100"/>
  <rect x="918" y="428" width="54" height="10" rx="3" fill="#ffffff"/>
  <rect x="912" y="438" width="66" height="36" rx="4" fill="#ffffff"/>
  <text x="945" y="508" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Project Skill</text>
  <text x="945" y="532" text-anchor="middle" font-size="13" fill="#ffffff">repository (.claude/skills/)</text>
</svg>
