<svg viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="650" fill="#fcfcfb"/>

  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b0b0b">Vague Instruction vs. Explicit Match Criterion</text>

  <!-- Vague instruction box -->
  <rect x="60" y="240" width="360" height="220" rx="12" fill="#2a78d6"/>
  <text x="90" y="278" font-size="17" font-weight="bold" fill="#ffffff">VAGUE INSTRUCTION</text>
  <text x="90" y="312" font-size="15" font-style="italic" fill="#ffffff">"Be conservative —</text>
  <text x="90" y="336" font-size="15" font-style="italic" fill="#ffffff">only flag issues you're</text>
  <text x="90" y="360" font-size="15" font-style="italic" fill="#ffffff">confident about."</text>
  <text x="90" y="400" font-size="13" fill="#ffffff">No calibrated threshold —</text>
  <text x="90" y="422" font-size="13" fill="#ffffff">shifts every run.</text>

  <!-- Arrow -->
  <line x1="422" y1="350" x2="556" y2="350" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="489" y="332" text-anchor="middle" font-size="14" font-style="italic" fill="#52514e">replaced by</text>

  <!-- Header for explicit stack -->
  <text x="850" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b0b0b">Explicit Match Criterion — Four-Part Anchor</text>

  <!-- Box 1: Category Name -->
  <rect x="560" y="125" width="580" height="95" rx="12" fill="#eb6834"/>
  <text x="590" y="155" font-size="16" font-weight="bold" fill="#ffffff">1 &#183; CATEGORY NAME</text>
  <text x="590" y="182" font-size="14" fill="#ffffff">e.g., "Security Vulnerability"</text>

  <!-- Box 2: Match Condition -->
  <rect x="560" y="230" width="580" height="95" rx="12" fill="#1baf7a"/>
  <text x="590" y="260" font-size="16" font-weight="bold" fill="#ffffff">2 &#183; MATCH CONDITION (what qualifies)</text>
  <text x="590" y="286" font-size="13" fill="#ffffff">Direct contradiction between claim and code</text>

  <!-- Box 3: Non-Match Condition -->
  <rect x="560" y="335" width="580" height="95" rx="12" fill="#eda100"/>
  <text x="590" y="365" font-size="16" font-weight="bold" fill="#ffffff">3 &#183; NON-MATCH CONDITION (what doesn't qualify)</text>
  <text x="590" y="391" font-size="13" fill="#ffffff">Incomplete, minor staleness, intent-only language</text>

  <!-- Box 4: Code Example -->
  <rect x="560" y="440" width="580" height="140" rx="12" fill="#e87ba4"/>
  <text x="590" y="470" font-size="16" font-weight="bold" fill="#ffffff">4 &#183; CONCRETE CODE EXAMPLE</text>
  <text x="590" y="500" font-size="13" fill="#ffffff">def save_draft(user_id, content):</text>
  <text x="590" y="520" font-size="13" fill="#ffffff">    drafts[user_id] = content</text>
  <text x="590" y="540" font-size="13" fill="#ffffff">    # overwrites — no merge/versioning</text>
</svg>
